[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.31"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

# Monad ships Foundry support natively from v1.8.0 (`network = "monad"`).
# Local WSL toolchain is 1.5.1 — run `foundryup` before enabling the line below.
# network = "monad"

# Sources: docs/INTEGRATION-FACTS.md §1
[rpc_endpoints]
monad = "${MONAD_MAINNET_RPC_URL}"
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[etherscan]
monad = { key = "${MONAD_EXPLORER_API_KEY}", url = "https://api.monadscan.com/api", chain = 143 }
monad_testnet = { key = "${MONAD_EXPLORER_API_KEY}", url = "https://api-testnet.monadscan.com/api", chain = 10143 }

[fuzz]
runs = 1024
