# Builds an Android APK on GitHub's runners instead of Expo's.
#
# `eas build --local` runs the same build EAS would, on this machine, and local builds do not
# count against the Expo plan's cloud build allowance. The keystore still comes from the
# miracle_codes EAS project, so the APK carries the same signing certificate that
# web/public/.well-known/assetlinks.json vouches for, and installs over the previous build.
#
# Needs one repository secret, EXPO_TOKEN: an access token from expo.dev for the account that
# owns the project. Run it from the Actions tab.

name: Android build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "development needs Metro on your machine. preview runs standalone, for your own demo. community is the one to hand to other people: standalone, and its version number climbs so installs upgrade cleanly."
        type: choice
        default: community
        options: [community, preview, development]
      release_tag:
        description: "Attach the APK to a public GitHub Release under this tag, e.g. v0.1.1. Leave empty to publish nothing. Uploading happens on the runner, so the file never travels via anyone's laptop."
        type: string
        default: ""

permissions:
  # write, because a tagged run publishes the APK as a release asset
  contents: write

concurrency:
  group: android-build-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # The certificate assetlinks.json names. A build signed by anything else cannot use
      # usehenad.xyz passkeys, so it fails here rather than on someone's phone.
      EXPECTED_CERT_SHA256: 75d9ea6d7f065abe8fea5d3717663f9164d9870aa5b258dd7701c2fa7cd71222
    steps:
      - name: Require the Expo token
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::error::Add an EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens), then run again."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the APK
        working-directory: mobile
        run: pnpm exec eas build --platform android --profile "${{ inputs.profile }}" --local --non-interactive --output "$RUNNER_TEMP/henad.apk"

      - name: Check the signing certificate
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs "$RUNNER_TEMP/henad.apk" | awk '/SHA-256 digest/ {print $NF; exit}')
          echo "Signed with $actual"
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::The APK is signed with $actual, not the certificate in assetlinks.json. Passkeys would fail with 'RP ID cannot be validated'."
            exit 1
          fi

      - name: Name the file after the release, when there is one
        id: name
        run: |
          version=$(node -p "require('./mobile/package.json').version || '0.0.0'" 2>/dev/null || echo 0.0.0)
          file="henad-${{ inputs.release_tag || format('{0}-{1}', inputs.profile, github.run_number) }}-android.apk"
          mv "$RUNNER_TEMP/henad.apk" "$RUNNER_TEMP/$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: henad-${{ inputs.profile }}-apk
          path: ${{ runner.temp }}/${{ steps.name.outputs.file }}
          retention-days: 14
          if-no-files-found: error

      # A release is what someone without a GitHub account can download. The artifact above
      # needs a login and expires; this does neither.
      - name: Publish the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ inputs.release_tag }}'
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Android build of Henad, signed with the certificate usehenad.xyz vouches for."
            echo
            echo "Install on Android 9 or later with Google Password Manager. There is no Play Store listing, so allow installing from this source when asked."
            echo
            echo "**This is real money on Monad mainnet.** Your passkey is your account: nobody can reset it or move your funds, including us. A payout cannot be undone."
            echo
            echo '```'
            echo "sha256  ${{ steps.name.outputs.sha256 }}"
            echo '```'
            echo
            echo "Built from ${{ github.sha }} on the ${{ inputs.profile }} profile."
          } > "$notes"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/${{ steps.name.outputs.file }}" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP/${{ steps.name.outputs.file }}" -R "$GITHUB_REPOSITORY"               --title "Henad $tag for Android" --notes-file "$notes"
          fi
          echo "::notice::Published $tag: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
